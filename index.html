<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="散財筋トレ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>散財筋トレ</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1b1b1d; --sub:#6b6b72; --line:#e7e4de;
  --accent:#ff5a2c; --accent-soft:#ffe8df; --on-accent:#ffffff;
  --ok:#1f9d55; --ok-soft:#dcf3e5; --danger:#d93636;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --card:#1c1d20; --text:#f2f2f3; --sub:#9b9ba3; --line:#2d2e33;
    --accent:#ff6a3d; --accent-soft:#3a2119; --on-accent:#ffffff;
    --ok:#3ccf7a; --ok-soft:#173424; --danger:#ff6b6b;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.top{padding:8px 4px 16px}
.top .date{color:var(--sub);font-size:14px;font-weight:600}
.top h1{font-size:28px;font-weight:800;letter-spacing:.02em}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:0 1px 0 var(--line)}
.label{color:var(--sub);font-size:13px;font-weight:700}
.big{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.big span{font-size:16px;margin-left:2px;font-weight:700}
.accent{color:var(--accent)}
.okc{color:var(--ok)}
.note{color:var(--sub);font-size:12px;margin-top:2px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero-row .right{text-align:right}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .3s}
.bar.ok i{background:var(--ok)}
.bar.small{height:6px;margin-top:8px}
.status{margin-top:10px;font-weight:700;font-size:15px}
.sec{font-size:15px;font-weight:800;margin:22px 4px 10px}

/* add form */
.amount{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 0;margin-top:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-size:26px;font-weight:800;color:var(--sub)}
.amount input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chips button{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px}
.text{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.text:focus{border-color:var(--accent)}
.primary{display:block;width:100%;margin-top:12px;background:var(--accent);color:var(--on-accent);
  font-weight:800;font-size:17px;padding:14px;border-radius:14px}
.primary:active{transform:scale(.98)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* exercises */
.ex.zero{opacity:.55}
.ex.clear{box-shadow:0 0 0 2px var(--ok) inset}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-head h3{font-size:17px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-head p{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.ex-head p b{font-size:22px;color:var(--text)}
.ex-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.ex-btns button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-weight:700;font-size:15px}
.ex-btns button:active{background:var(--accent-soft)}
.ex-btns .fill{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.rate{color:var(--sub);font-size:12px;margin-top:8px}

/* lists */
.list{list-style:none;background:var(--card);border-radius:var(--radius);overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow p{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list small{color:var(--sub);font-size:12px}
.list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.del{width:32px;height:32px;border-radius:50%;color:var(--sub);font-size:18px;flex:none}
.del:active{background:var(--line)}
.empty{color:var(--sub);text-align:center;padding:20px;font-size:14px;background:var(--card);border-radius:var(--radius)}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.ng{background:var(--accent-soft);color:var(--accent)}
.badge.free{background:var(--line);color:var(--sub)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats .card{margin:0;padding:12px}
.stats .big{font-size:22px}

/* settings */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field>span{font-weight:700}
.mini{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:14px}
.mini input{width:84px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;color:var(--text);outline:none}
.mini input:focus{border-color:var(--accent)}
.ex-set .row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;align-items:center}
.ex-set .rm{margin-left:auto;color:var(--danger);font-size:14px;font-weight:700;padding:6px 4px}
.hint{color:var(--sub);font-size:12px;margin-top:8px}
.ghost{display:block;width:100%;padding:14px;border-radius:14px;border:2px dashed var(--line);color:var(--sub);font-weight:700}
.danger{display:block;width:100%;padding:14px;border-radius:14px;background:var(--card);color:var(--danger);font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 16px calc(env(safe-area-inset-bottom) + 6px)}
.tabs button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--sub);font-size:11px;font-weight:700}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="date" id="date"></p>
    <h1>散財筋トレ</h1>
  </header>

  <section id="view-today">
    <div id="hero"></div>

    <form class="card" id="addForm" autocomplete="off">
      <p class="label">出費を記録</p>
      <div class="amount"><span>¥</span><input id="amt" inputmode="numeric" placeholder="0" aria-label="金額"></div>
      <div class="chips">
        <button type="button" data-add="100">+100</button>
        <button type="button" data-add="500">+500</button>
        <button type="button" data-add="1000">+1,000</button>
        <button type="button" data-add="5000">+5,000</button>
      </div>
      <input class="text" id="memo" maxlength="30" placeholder="メモ（任意）例：ランチ" aria-label="メモ">
      <button class="primary" type="submit">追加</button>
    </form>

    <h2 class="sec">今日の筋トレ</h2>
    <div id="exList"></div>

    <h2 class="sec">今日の出費</h2>
    <div id="spendList"></div>
  </section>

  <section id="view-history" hidden></section>
  <section id="view-settings" hidden></section>
</div>

<nav class="tabs">
  <button data-tab="today" class="on">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>今日
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>履歴
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定
  </button>
</nav>

<script>
"use strict";
const KEY = "sanzai-kintore-v1";
const DEFAULT = {
  settings: {
    allowance: 0,
    exercises: [
      { id: "pushup", name: "腕立て伏せ", yen: 100, cap: 100 },
      { id: "squat",  name: "スクワット", yen: 100, cap: 100 },
      { id: "situp",  name: "腹筋",       yen: 200, cap: 50 }
    ]
  },
  days: {}
};

let state = load();
let tab = "today";

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.settings && s.days) return s;
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const fmt = (n) => n.toLocaleString("ja-JP");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const emptyDay = () => ({ spends: [], done: {} });
function dayLabel(k) {
  const [y, m, d] = k.split("-").map(Number);
  const w = "日月火水木金土"[new Date(y, m - 1, d).getDay()];
  return `${m}月${d}日（${w}）`;
}
function parseYen(v) {
  const s = String(v)
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/[^0-9]/g, "");
  return Math.min(parseInt(s || "0", 10), 99999999);
}
function getDay(k, create) {
  if (!state.days[k]) {
    if (!create) return emptyDay();
    state.days[k] = emptyDay();
  }
  return state.days[k];
}

/* ---------- core logic ---------- */
const spentOf = (d) => d.spends.reduce((a, s) => a + s.amt, 0);
function reqsOf(d) {
  const over = Math.max(0, spentOf(d) - (state.settings.allowance || 0));
  const r = {};
  for (const e of state.settings.exercises) {
    let n = e.yen > 0 ? Math.floor(over / e.yen) : 0;
    if (e.cap > 0) n = Math.min(n, e.cap);
    r[e.id] = n;
  }
  return r;
}
function summary(d) {
  const reqs = reqsOf(d);
  let req = 0, done = 0, raw = 0;
  for (const e of state.settings.exercises) {
    const dn = d.done[e.id] || 0;
    req += reqs[e.id];
    done += Math.min(dn, reqs[e.id]);
    raw += dn;
  }
  return { reqs, req, done, raw, spent: spentOf(d), ok: done >= req };
}
function streak() {
  const keys = Object.keys(state.days).sort();
  if (!keys.length) return 0;
  const first = keys[0], tk = todayKey();
  const dt = new Date();
  let n = 0;
  while (true) {
    const k = keyOf(dt);
    if (k < first) break;
    if (summary(getDay(k)).ok) n++;
    else if (k !== tk) break;
    dt.setDate(dt.getDate() - 1);
  }
  return n;
}

/* ---------- render: today ---------- */
function renderToday() {
  const k = todayKey();
  const d = getDay(k);
  const s = summary(d);
  const remain = s.req - s.done;
  const pct = s.req ? Math.round((s.done / s.req) * 100) : (s.spent ? 100 : 0);
  const allowance = state.settings.allowance || 0;

  let msg;
  if (s.spent === 0) msg = "まだ出費なし。この調子！";
  else if (s.req === 0) msg = "無料枠の範囲内。今日は筋トレなし";
  else if (remain === 0) msg = "今日のノルマ達成！💪";
  else msg = `あと ${fmt(remain)} 回で達成`;

  $("#date").textContent = dayLabel(k);
  $("#hero").innerHTML = `
    <div class="card">
      <div class="hero-row">
        <div>
          <p class="label">今日の出費</p>
          <p class="big">¥${fmt(s.spent)}</p>
          ${allowance ? `<p class="note">無料枠 ¥${fmt(allowance)}</p>` : ""}
        </div>
        <div class="right">
          <p class="label">残り</p>
          <p class="big ${remain ? "accent" : "okc"}">${fmt(remain)}<span>回</span></p>
        </div>
      </div>
      <div class="bar ${remain === 0 && s.spent ? "ok" : ""}"><i style="width:${pct}%"></i></div>
      <p class="status">${msg}</p>
    </div>`;

  const exs = state.settings.exercises;
  $("#exList").innerHTML = exs.length ? exs.map((e) => {
    const req = s.reqs[e.id], dn = d.done[e.id] || 0;
    const p = req ? Math.min(100, Math.round((dn / req) * 100)) : 0;
    const cls = req === 0 ? "zero" : dn >= req ? "clear" : "";
    return `
    <div class="card ex ${cls}">
      <div class="ex-head">
        <h3>${esc(e.name)}</h3>
        <p><b>${fmt(dn)}</b> / ${fmt(req)} 回</p>
      </div>
      <div class="bar small ${dn >= req && req ? "ok" : ""}"><i style="width:${p}%"></i></div>
      <div class="ex-btns">
        <button data-act="inc" data-id="${e.id}" data-n="-1">−1</button>
        <button data-act="inc" data-id="${e.id}" data-n="1">+1</button>
        <button data-act="inc" data-id="${e.id}" data-n="5">+5</button>
        <button data-act="inc" data-id="${e.id}" data-n="10">+10</button>
        <button data-act="fill" data-id="${e.id}" class="fill">完了</button>
      </div>
      <p class="rate">¥${fmt(e.yen)} ごとに1回${e.cap ? ` ・ 上限 ${fmt(e.cap)} 回` : ""}</p>
    </div>`;
  }).join("") : `<p class="empty">設定から種目を追加してください</p>`;

  const sp = d.spends.slice().reverse();
  $("#spendList").innerHTML = sp.length ? `<ul class="list">${sp.map((x) => {
    const t = new Date(x.t);
    return `<li>
      <div class="grow"><p>${x.memo ? esc(x.memo) : "出費"}</p><small>${pad(t.getHours())}:${pad(t.getMinutes())}</small></div>
      <b>¥${fmt(x.amt)}</b>
      <button class="del" data-act="del" data-id="${x.id}" aria-label="削除">×</button>
    </li>`;
  }).join("")}</ul>` : `<p class="empty">まだ記録はありません</p>`;
}

/* ---------- render: history ---------- */
function renderHistory() {
  const keys = Object.keys(state.days).sort().reverse();
  const ym = todayKey().slice(0, 7);
  let mSpent = 0, mReps = 0;
  for (const k of keys) {
    if (!k.startsWith(ym)) continue;
    const s = summary(state.days[k]);
    mSpent += s.spent; mReps += s.raw;
  }
  const items = keys.map((k) => {
    const s = summary(state.days[k]);
    if (!s.spent && !s.raw) return "";
    const badge = s.req === 0 ? `<span class="badge free">筋トレなし</span>`
      : s.ok ? `<span class="badge ok">達成</span>`
      : `<span class="badge ng">${fmt(s.req - s.done)}回残し</span>`;
    return `<li>
      <div class="grow"><p>${dayLabel(k)}</p><small>¥${fmt(s.spent)} ・ ${fmt(s.done)} / ${fmt(s.req)} 回</small></div>
      ${badge}
    </li>`;
  }).join("");

  $("#view-history").innerHTML = `
    <div class="stats">
      <div class="card"><p class="label">連続達成</p><p class="big">${streak()}<span>日</span></p></div>
      <div class="card"><p class="label">今月の出費</p><p class="big">¥${fmt(mSpent)}</p></div>
      <div class="card"><p class="label">今月の回数</p><p class="big">${fmt(mReps)}<span>回</span></p></div>
    </div>
    <h2 class="sec">これまで</h2>
    ${items ? `<ul class="list">${items}</ul>` : `<p class="empty">まだ記録はありません</p>`}`;
}

/* ---------- render: settings ---------- */
function renderSettings() {
  const st = state.settings;
  $("#view-settings").innerHTML = `
    <div class="card">
      <div class="field">
        <span>1日の無料枠</span>
        <label class="mini">¥<input data-set="allowance" inputmode="numeric" value="${st.allowance || 0}"></label>
      </div>
      <p class="hint">この金額を超えた分だけ筋トレが発生します（0なら1円目から）</p>
    </div>

    <h2 class="sec">種目</h2>
    ${st.exercises.map((e) => `
      <div class="card ex-set">
        <input class="text" data-ex="name" data-id="${e.id}" value="${esc(e.name)}" maxlength="20" aria-label="種目名">
        <div class="row">
          <label class="mini">¥<input data-ex="yen" data-id="${e.id}" inputmode="numeric" value="${e.yen}">ごとに1回</label>
          <label class="mini">上限<input data-ex="cap" data-id="${e.id}" inputmode="numeric" value="${e.cap}">回</label>
          <button class="rm" data-act="rmEx" data-id="${e.id}">削除</button>
        </div>
      </div>`).join("")}
    <p class="hint" style="margin:0 4px 12px">上限を 0 にすると上限なしになります</p>
    <button class="ghost" data-act="addEx">＋ 種目を追加</button>

    <h2 class="sec">データ</h2>
    <button class="danger" data-act="reset">すべての記録を削除</button>
    <p class="hint">データはこの端末の中だけに保存され、どこにも送信されません。</p>`;
}

function render() {
  if (tab === "today") renderToday();
  else if (tab === "history") renderHistory();
  else renderSettings();
  if (tab !== "today") $("#date").textContent = dayLabel(todayKey());
}

function switchTab(t) {
  tab = t;
  for (const v of ["today", "history", "settings"]) $("#view-" + v).hidden = v !== t;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  render();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
$("#addForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const amtEl = $("#amt"), n = parseYen(amtEl.value);
  if (n <= 0) {
    amtEl.parentElement.classList.remove("shake");
    void amtEl.offsetWidth;
    amtEl.parentElement.classList.add("shake");
    amtEl.focus();
    return;
  }
  getDay(todayKey(), true).spends.push({ id: uid(), amt: n, memo: $("#memo").value.trim(), t: Date.now() });
  save();
  amtEl.value = ""; $("#memo").value = "";
  amtEl.blur(); $("#memo").blur();
  renderToday();
});

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-tab],[data-add],[data-act]");
  if (!t) return;
  if (t.dataset.tab) return switchTab(t.dataset.tab);
  if (t.dataset.add) {
    const a = $("#amt");
    a.value = fmt(parseYen(a.value) + Number(t.dataset.add));
    return;
  }
  const id = t.dataset.id;
  const k = todayKey();
  switch (t.dataset.act) {
    case "inc": {
      const d = getDay(k, true);
      d.done[id] = Math.max(0, (d.done[id] || 0) + Number(t.dataset.n));
      break;
    }
    case "fill": {
      const d = getDay(k, true);
      d.done[id] = Math.max(d.done[id] || 0, reqsOf(d)[id] || 0);
      break;
    }
    case "del": {
      const d = getDay(k, true);
      d.spends = d.spends.filter((x) => x.id !== id);
      break;
    }
    case "addEx":
      state.settings.exercises.push({ id: uid(), name: "新しい種目", yen: 100, cap: 100 });
      break;
    case "rmEx":
      if (state.settings.exercises.length && !confirm("この種目を削除しますか？")) return;
      state.settings.exercises = state.settings.exercises.filter((e) => e.id !== id);
      break;
    case "reset":
      if (!confirm("すべての出費と筋トレの記録を削除します。よろしいですか？")) return;
      state.days = {};
      break;
    default: return;
  }
  save();
  render();
});

document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.set === "allowance") {
    state.settings.allowance = parseYen(el.value);
  } else if (el.dataset.ex) {
    const e = state.settings.exercises.find((x) => x.id === el.dataset.id);
    if (!e) return;
    if (el.dataset.ex === "name") e.name = el.value.trim() || "種目";
    else if (el.dataset.ex === "yen") e.yen = Math.max(1, parseYen(el.value));
    else e.cap = parseYen(el.value);
  } else return;
  save();
  renderSettings();
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

render();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
